[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tero"
version = "0.1.0"
description = "Deterministic reverse-engineering pipeline on top of Ghidra: binary -> structured report -> rule-based findings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renzo Di Guglielmo" }]
keywords = ["reverse-engineering", "ghidra", "malware-analysis", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
]
dependencies = ["pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tero = "tero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tero = ["rules/*.yaml", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Jython (Python 2.7) que corre dentro de Ghidra: no aplica el lint de Python 3
extend-exclude = ["ghidra_scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
