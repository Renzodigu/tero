name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # windows-latest ya trae MinGW-w64 (gcc + mingw32-make) en el PATH
      - name: Check MinGW-w64
        run: |
          gcc --version
          mingw32-make --version

      - name: Install Tero
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build crackmes
        working-directory: muestras
        run: mingw32-make

      - name: Run tests (reglas + keygens)
        run: pytest -q
