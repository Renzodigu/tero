name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup MinGW-w64 (gcc)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Install Tero
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build crackmes
        working-directory: muestras
        run: mingw32-make

      - name: Run tests (reglas + keygens)
        run: pytest -q
